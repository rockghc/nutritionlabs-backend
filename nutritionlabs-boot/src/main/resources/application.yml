server:
  # Port of the former Zuul gateway, the front end proxy already points to it.
  port: 8083

spring:
  application:
    name: NutritionLabsBackend

  datasource:
    url: jdbc:postgresql://localhost:5432/NutritionLabsBD?currentSchema=nutritionlabs
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Elvish}

  jpa:
    open-in-view: false
    hibernate:
      # The schema is created by the scripts of the database folder.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nutritionlabs

  security:
    oauth2:
      resourceserver:
        jwt:
          # Signing keys of the existing Keycloak realm.
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080/auth}/realms/${KEYCLOAK_REALM:freedom-realm-keycloak}/protocol/openid-connect/certs

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 400MB
      max-request-size: 600MB

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  data:
    web:
      pageable:
        serialization-mode: direct

nutritionlabs:
  security:
    # Keycloak role required to call the API.
    required-role: user
    allowed-origins:
      - http://localhost:4200
  keycloak:
    # Admin REST API. The client needs the service account with the "manage-users" and "view-realm" roles of
    # "realm-management".
    url: ${KEYCLOAK_URL:http://localhost:8080/auth}
    realm: ${KEYCLOAK_REALM:freedom-realm-keycloak}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:nutritionlabs-backend}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:b582969d-1e3e-4e88-895a-37e9a948ad90}
    # Realm roles given to the new users.
    realm-roles:
      - user

logging:
  level:
    com.nutritionlabs: INFO
